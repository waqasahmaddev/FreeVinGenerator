    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_id }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', '{{ site.ga_id }}');
    </script>

{%- assign canonical = site.url | append: page.url -%}
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
{%- if page.keywords %}
    <meta name="keywords" content="{{ page.keywords }}">
{%- endif %}
{%- if page.robots %}
    <meta name="robots" content="{{ page.robots }}">
{%- endif %}

    <link rel="canonical" href="{{ canonical }}">

    <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
    <meta property="og:url" content="{{ canonical }}">
    <meta property="og:title" content="{{ page.og_title | default: page.title }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description }}">
    <meta property="og:image" content="{{ site.url }}{{ page.og_image | default: page.image | default: '/assets/og-image.jpg' }}">
    <meta property="og:site_name" content="FreeVinGenerator.com">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ canonical }}">
    <meta name="twitter:title" content="{{ page.twitter_title | default: page.og_title | default: page.title }}">
    <meta name="twitter:description" content="{{ page.twitter_description | default: page.og_description | default: page.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ page.twitter_image | default: page.image | default: '/assets/twitter-image.svg' }}">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%23667eea'/><stop offset='100%25' style='stop-color:%23764ba2'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><text x='50' y='70' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial,sans-serif'>V</text></svg>">
    <link rel="apple-touch-icon" href="https://freevingenerator.com/assets/apple-touch-icon.png">

    <link rel="preload" href="/assets/app.min.css" as="style">
    <link rel="preload" href="/assets/app.min.js" as="script">

    <link rel="dns-prefetch" href="//www.googletagmanager.com">
{%- for host in page.dns_prefetch %}
    <link rel="dns-prefetch" href="{{ host }}">
{%- endfor %}

    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <link rel="stylesheet" href="/assets/app.min.css">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>
