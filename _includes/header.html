    <a href="/" class="logo" aria-label="FreeVinGenerator.com homepage">
        <div class="logo-icon">V</div>
        <span>VIN Generator</span>
    </a>

    <nav id="mainNav" aria-label="Main navigation">
        <ul>
            <li{% if page.active == 'home' %} class="active"{% endif %}><a href="/"{% if page.active == 'home' %} aria-current="page"{% endif %}>VIN Generator</a></li>
            <li{% if page.active == 'decoder' %} class="active"{% endif %}><a href="/vin-decoder/"{% if page.active == 'decoder' %} aria-current="page"{% endif %}>VIN Decoder</a></li>

            <li{% if page.active == 'qr' %} class="active"{% endif %}><a href="/vin-qr-code-generator/"{% if page.active == 'qr' %} aria-current="page"{% endif %}>QR Generator</a></li>
            <li{% if page.active == 'visualizer' %} class="active"{% endif %}><a href="/vin-breakdown-visualizer/"{% if page.active == 'visualizer' %} aria-current="page"{% endif %}>Visualizer</a></li>
            <li{% if page.active == 'whatisvin' %} class="active"{% endif %}><a href="/what-is-a-vin/"{% if page.active == 'whatisvin' %} aria-current="page"{% endif %}>What is a VIN?</a></li>
        </ul>
    </nav>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">

            <line x1="12" y1="1" x2="12" y2="3"></line>

            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
