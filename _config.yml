# Site settings
title: Free VIN Generator
description: >-
  Generate valid VIN numbers instantly for free. Create random, properly
  formatted 17-character vehicle identification numbers for testing,
  development, and educational purposes.
url: "https://freevingenerator.com"

# Shared IDs used across all pages
ga_id: "G-7S2PPXMJSS"
adsense_client: "ca-pub-8817944753726221"

# Blog / posts
# Articles live in _posts/*.md and are published at /blog/<slug>/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      og_type: article
      body_class: bg-plain
      ad_sidebar: true
      scroll_top: true

# Plugins (all whitelisted by GitHub Pages' native Jekyll build)
plugins:
  - jekyll-sitemap   # auto-generates /sitemap.xml (includes every page + post)
  - jekyll-feed      # auto-generates /feed.xml RSS for the blog

# Files/folders that should NOT be copied into the built site
exclude:
  - README.md
  - package.json
  - package-lock.json
  - gulpfile.js
  - node_modules
  - Gemfile
  - Gemfile.lock
  - docs
  - .idea
  - vendor
